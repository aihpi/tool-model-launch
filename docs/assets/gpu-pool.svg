<text x='160' y='101.0' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>api_base</text>
<line x1='220' y1='148' x2='270' y2='148' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='245.0' y='140' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>mesh</text>
