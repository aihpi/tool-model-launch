<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1240 670' width='1240' height='670' role='img' aria-label='One Slurm job holding a GPU runs the pool agent: an OpenAI-compatible front door that dispatches by model name to per-model vLLM children sharing the GPU through sleep mode, waking the requested model and putting least-recently-used ones to sleep'>
