<rect x='290' y='110' width='380' height='76' rx='6' fill='#f8fafc' stroke='#2563eb' stroke-width='1.5'/>
<text x='480.0' y='130.5' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>pool_agent.py  (front door)</text>
<text x='480.0' y='145.5' font-size='10' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>:$FRAMEWORK_PORT · one OpenTela worker, service pool</text>
<text x='480.0' y='160.5' font-size='10' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>otela start --subprocess python3 …/pool_agent.py</text>
<text x='480.0' y='175.5' font-size='10' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>/health is 200 only once every model is resident</text>
<text x='480' y='205' font-size='11' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>dispatch on body.model</text>
<rect x='290' y='230' width='190' height='70' rx='6' fill='#f8fafc' stroke='#16a34a' stroke-width='1.5'/>
<text x='385' y='250' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>vllm serve A</text>
<text x='385' y='267' font-size='11' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>--enable-sleep-mode</text>
<text x='385' y='283' font-size='11' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>--gpu-memory-utilization 0.45</text>
<text x='385' y='318' font-size='12' text-anchor='middle' fill='#16a34a' font-weight='700' font-family='ui-sans-serif, system-ui, sans-serif'>awake</text>
