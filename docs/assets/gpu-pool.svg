<text x='605' y='250' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>vllm serve B</text>
<text x='605' y='267' font-size='11' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>--enable-sleep-mode</text>
<text x='605' y='283' font-size='11' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>--gpu-memory-utilization 0.45</text>
<text x='605' y='318' font-size='12' text-anchor='middle' fill='#16a34a' font-weight='700' font-family='ui-sans-serif, system-ui, sans-serif'>awake</text>
<line x1='480' y1='186' x2='605' y2='230' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)'/>
<rect x='730' y='230' width='190' height='70' rx='6' fill='#f8fafc' stroke='#64748b' stroke-width='1.5'/>
<text x='825' y='250' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>vllm serve C</text>
<text x='825' y='267' font-size='11' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>--enable-sleep-mode</text>
<text x='825' y='283' font-size='11' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>--gpu-memory-utilization 0.90</text>
<text x='825' y='318' font-size='12' text-anchor='middle' fill='#64748b' font-weight='700' font-family='ui-sans-serif, system-ui, sans-serif'>asleep</text>
<line x1='480' y1='186' x2='825' y2='230' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)' stroke-dasharray='4 3'/>
<text x='910' y='100' font-size='10' text-anchor='end' fill='#64748b' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>children: VLLM_SERVER_DEV_MODE=1 CUDA_VISIBLE_DEVICES=&lt;gpus&gt;</text>
<text x='290' y='342' font-size='11' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>H100 · 80 GB</text>
<rect x='290' y='350' width='620' height='34' rx='4' fill='#ffffff' stroke='#94a3b8' stroke-width='1.5'/>
<rect x='290' y='350' width='279.0' height='34' rx='4' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='429.5' y='372' font-size='11' text-anchor='middle' fill='#334155' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>A  weights + KV cache  (0.45)</text>
<rect x='569.0' y='350' width='279.0' height='34' rx='4' fill='#dcfce7' stroke='#16a34a' stroke-width='1.5'/>
<text x='708.5' y='372' font-size='11' text-anchor='middle' fill='#334155' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>B  weights + KV cache  (0.45)</text>
<rect x='848.0' y='350' width='62.0' height='34' rx='4' fill='#f1f5f9' stroke='#94a3b8' stroke-width='1.5'/>
<text x='879.0' y='372' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>free</text>
<text x='290' y='398' font-size='10' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>≈0.5 GB CUDA context per sleeping child · Σ awake ≤ 1 − gpu_headroom</text>
<text x='290' y='412' font-size='11' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>host RAM (--mem)</text>
<rect x='290' y='420' width='620' height='34' rx='4' fill='#ffffff' stroke='#94a3b8' stroke-width='1.5'/>
<rect x='476.0' y='420' width='372.0' height='34' rx='4' fill='#f1f5f9' stroke='#64748b' stroke-width='1.5'/>
<text x='662.0' y='442' font-size='11' text-anchor='middle' fill='#334155' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>C  weights offloaded (sleep level 1): wakes in seconds</text>
<line x1='890' y1='300' x2='890' y2='420' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)' stroke-dasharray='4 3'/>
<text x='890' y='340' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>/sleep?level=1</text>
<text x='282' y='488' font-size='10' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>sleeper loop, every 30 s: awake, in_flight = 0, idle &gt;= sleep_after -&gt; drain -&gt; /sleep</text>
<text x='1080' y='52' font-size='13' text-anchor='middle' fill='#334155' font-weight='700' font-family='ui-sans-serif, system-ui, sans-serif'>per-model state machine</text>
<rect x='1020' y='80' width='120' height='36' rx='18' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.5'/>
<text x='1080' y='103' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>cold</text>
<rect x='1020' y='170' width='120' height='36' rx='18' fill='#f8fafc' stroke='#94a3b8' stroke-width='1.5'/>
<text x='1080' y='193' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>starting</text>
<rect x='1020' y='270' width='120' height='36' rx='18' fill='#f8fafc' stroke='#16a34a' stroke-width='1.5'/>
<text x='1080' y='293' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>awake</text>
<rect x='1020' y='400' width='120' height='36' rx='18' fill='#f8fafc' stroke='#64748b' stroke-width='1.5'/>
<text x='1080' y='423' font-size='12' text-anchor='middle' fill='#334155' font-weight='600' font-family='ui-sans-serif, system-ui, sans-serif'>asleep</text>
<line x1='1080' y1='116' x2='1080' y2='170' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='1080' y='148' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>vllm serve (request or boot)</text>
<line x1='1080' y1='206' x2='1080' y2='270' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='1080' y='243' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>/health 200</text>
<line x1='1060' y1='306' x2='1060' y2='400' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='1004' y='350' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>drain, then /sleep</text>
<text x='1004' y='363' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>idle ≥ sleep_after</text>
<text x='1004' y='376' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>or LRU eviction</text>
<line x1='1100' y1='400' x2='1100' y2='306' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='1156' y='350' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>/wake_up</text>
<text x='1156' y='363' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>on request, after</text>
<text x='1156' y='376' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>freeing its GPUs</text>
<path d='M 1140 418 L 1190 418 L 1190 98 L 1140 98' fill='none' stroke='#64748b' stroke-width='1.5' marker-end='url(#arrow)' stroke-dasharray='4 3'/>
<text x='1192' y='260' font-size='10' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>child died</text>
<text x='1080' y='470' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>boot: start each model in turn, sleep it,</text>
<text x='1080' y='483' font-size='10' text-anchor='middle' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>then the next — vLLM needs its fraction free at start</text>
<text x='20' y='560' font-size='11' text-anchor='start' fill='#334155' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>Request for C while A and B are awake: plan_wake picks the least-recently-used awake models on C's GPUs (A, then B), drains and sleeps them,</text>
<text x='20' y='578' font-size='11' text-anchor='start' fill='#334155' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>then /wake_up C. Requests for A and B keep flowing while both fit (0.45 + 0.45 ≤ 0.95). Sleeping mid-request would crash vLLM, so drain always comes first.</text>
<rect x='20' y='596' width='22' height='12' rx='3' fill='#f8fafc' stroke='#16a34a' stroke-width='1.5'/>
<text x='50' y='606' font-size='11' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>awake: holds its GPU fraction</text>
<rect x='20' y='612' width='22' height='12' rx='3' fill='#f8fafc' stroke='#64748b' stroke-width='1.5'/>
<text x='50' y='622' font-size='11' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>asleep: weights in host RAM, GPU memory released</text>
<rect x='20' y='628' width='22' height='12' rx='3' fill='#f8fafc' stroke='#2563eb' stroke-width='1.5'/>
<text x='50' y='638' font-size='11' text-anchor='start' fill='#64748b' font-weight='normal' font-family='ui-sans-serif, system-ui, sans-serif'>new code in this fork (assets/pool_agent.py, --framework pool)</text>
