<text x='120.0' y='78.5' font-size='10' text-anchor='middle' fill='#475569' font-weight='normal' font-family='ui-monospace, SFMono-Regular, Menlo, monospace'>rows: hosted_vllm/&lt;user&gt;/…</text>
